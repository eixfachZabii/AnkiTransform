[project]
name = "ankitransform"
version = "0.2.0"
description = "Turn textbook photos into Anki flashcard decks"
requires-python = ">=3.10"
dependencies = [
    "pdf2image",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
